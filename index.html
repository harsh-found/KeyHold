<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Keyhold — a beautiful private ledger of every place you sign in." />
    <title>Keyhold — Your Sign-in Ledger</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('keyhold:settings:v1');
          if (s) {
            var p = JSON.parse(s);
            if (p.darkMode) document.documentElement.classList.add('dark');
            if (p.fontSize) document.documentElement.setAttribute('data-font-scale', p.fontSize);
          } else {
            var t = localStorage.getItem('keyhold:theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
